<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Aero Pulse</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    /* The game is 160x144 pixels. CSS scales it up without blurring. */
    #screen {
      width: min(90vw, calc(60vh * 160 / 144));
      aspect-ratio: 160 / 144;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #9bbc0f;
      border: 4px solid #333;
      border-radius: 4px;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(94vw, 480px);
      gap: 12px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 64px);
      gap: 8px;
    }
    .dpad [data-key="ArrowUp"]    { grid-area: 1 / 2; }
    .dpad [data-key="ArrowLeft"]  { grid-area: 2 / 1; }
    .dpad [data-key="ArrowRight"] { grid-area: 2 / 3; }
    .dpad [data-key="ArrowDown"]  { grid-area: 3 / 2; }

    .actions { display: flex; gap: 22px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 14px; }

    button {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      touch-action: none;
    }
    button:active, button.pressed { background: #555; }

    .round { width: 74px; height: 74px; border-radius: 50%; font-size: 20px; }
    .pill  { padding: 10px 20px; font-size: 13px; }

    #hint { font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="screen" width="160" height="144"></canvas>

    <!-- On-screen controls for touch. data-key matches the keyboard key names. -->
    <div id="controls">
      <div class="dpad">
        <button data-key="ArrowUp">&#9650;</button>
        <button data-key="ArrowLeft">&#9664;</button>
        <button data-key="ArrowRight">&#9654;</button>
        <button data-key="ArrowDown">&#9660;</button>
      </div>

      <div class="menu-buttons">
        <button class="pill" data-key="Enter">START</button>
        <button class="pill" data-key="Shift">SELECT</button>
      </div>

      <div class="actions">
        <button class="round" data-key="x">B</button>
        <button class="round" data-key="z">A</button>
      </div>
    </div>

    <div id="hint">Arrows: move &middot; Z: A &middot; X: B &middot; Enter: Start &middot; Shift: Select</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
